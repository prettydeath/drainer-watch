[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drainer-watch"
version = "0.1.0"
description = "Monitor of crypto drainer contracts on Ethereum, BSC and Base with deployer and VASP links"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28", "pycryptodome>=3.18"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
drainerwatch = "drainerwatch.cli:main"

[tool.setuptools]
packages = ["drainerwatch"]

[tool.setuptools.package-data]
drainerwatch = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
