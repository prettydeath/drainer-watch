name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  # read-only size diagnostics of the state in the data-latest release (never uploads anything)
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [drainerwatch-bsc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome
      - name: Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . scripts/release_state.sh
          mkdir -p _rel
          rel_get "${{ matrix.db }}.sqlite.gz" "_rel/${{ matrix.db }}.sqlite.gz"
          gunzip -c "_rel/${{ matrix.db }}.sqlite.gz" > "_rel/${{ matrix.db }}.sqlite"
          ls -la _rel
          python -c "import sqlite3; c=sqlite3.connect(':memory:'); print(sqlite3.sqlite_version, [r[0] for r in c.execute('pragma compile_options') if 'DBSTAT' in r[0]])"
          python -m drainerwatch stats "_rel/${{ matrix.db }}.sqlite"
          python - "_rel/${{ matrix.db }}.sqlite" <<'PY'
          import sqlite3, sys
          c = sqlite3.connect(sys.argv[1])
          q = lambda s: c.execute(s).fetchall()
          print("approvals", q("SELECT COUNT(*), COUNT(DISTINCT owner), COUNT(DISTINCT spender) FROM approvals"))
          print("public", q("SELECT v FROM meta WHERE k='public_spenders:bsc'"))
          h = q("SELECT CASE WHEN o>=300 THEN '300+' WHEN o>=100 THEN '100-299' WHEN o>=30 THEN '30-99' WHEN o>=10 THEN '10-29' ELSE '<10' END b, COUNT(*), SUM(o) FROM (SELECT spender, COUNT(DISTINCT owner) o FROM approvals GROUP BY spender) GROUP BY b")
          print("spender owner-count histogram (bucket, spenders, owner-links):", h)
          for sp, o in q("SELECT spender, COUNT(DISTINCT owner) o FROM approvals GROUP BY spender ORDER BY o DESC LIMIT 25"):
              print("  ", sp, o, q(f"SELECT tier,labels FROM contracts WHERE address='{sp}'"), q(f"SELECT COUNT(*) FROM codes WHERE address='{sp}' AND size>0"))
          print("contracts tiers", q("SELECT tier,COUNT(*) FROM contracts GROUP BY 1"))
          PY
