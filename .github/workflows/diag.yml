name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  # read-only size diagnostics of the state in the data-latest release (never uploads anything)
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [drainerwatch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome
      - name: Stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . scripts/release_state.sh
          mkdir -p _rel
          rel_get "${{ matrix.db }}.sqlite.gz" "_rel/${{ matrix.db }}.sqlite.gz"
          gunzip -c "_rel/${{ matrix.db }}.sqlite.gz" > "_rel/${{ matrix.db }}.sqlite"
          ls -la _rel
          python -c "import sqlite3; c=sqlite3.connect(':memory:'); print(sqlite3.sqlite_version, [r[0] for r in c.execute('pragma compile_options') if 'DBSTAT' in r[0]])"
          python -m drainerwatch stats "_rel/${{ matrix.db }}.sqlite"
          python - "_rel/${{ matrix.db }}.sqlite" <<'PY'
          import sqlite3, sys
          c = sqlite3.connect(sys.argv[1])
          q = lambda s: c.execute(s).fetchall()
          sp = q("SELECT chain,spender,COUNT(*) n,COUNT(DISTINCT owner) o FROM approvals GROUP BY 1,2 HAVING o>300 ORDER BY n DESC")
          print("spenders >300 owners:", len(sp), "rows", sum(r[2] for r in sp), "of", q("SELECT COUNT(*) FROM approvals"))
          for ch, a, n, o in sp[:40]:
              t = q(f"SELECT tier,labels,victims FROM contracts WHERE chain='{ch}' AND address='{a}'")
              e = q(f"SELECT type,COUNT(*) FROM evidence WHERE chain='{ch}' AND address='{a}' GROUP BY 1")
              print("  ", ch, a, n, o, t, e)
          for ch, a in [("bsc","0x1a863449667e082eb818557925344cad6e2eb3b1"),("base","0x2e4bb66c8edd23cf8cbe71ab0519e14833e43b43"),("bsc","0x29493fdee62cb2b3b2edf3cf1ac5a008e26749ad"),("base","0x5f63d194b5e57a9e3410e704a0cfa21e69fd13ac"),("bsc","0x278d858f05b94576c1e6f73285886876ff6ef8d2"),("base","0xe807a76385ec3d76d17ab955091c12329d0a1403"),("eth","0x00fe78205f5f0e63b8ad2b2ae5337f538a610e04")]:
              print("subj", ch, a, q(f"SELECT tier,labels,victims,drains FROM contracts WHERE chain='{ch}' AND address='{a}'"))
          print("T1/T2 evidence rows:", q("SELECT c.tier,COUNT(*) FROM evidence e JOIN contracts c ON c.chain=e.chain AND c.address=e.address WHERE c.tier IN ('T1','T2') GROUP BY 1"))
          print("T1/T2 drains rows:", q("SELECT c.tier,COUNT(*) FROM drains e JOIN contracts c ON c.chain=e.chain AND c.address=e.drainer WHERE c.tier IN ('T1','T2') GROUP BY 1"))
          print("evidence rows of no-tier subjects:", q("SELECT COUNT(*) FROM evidence e LEFT JOIN contracts c ON c.chain=e.chain AND c.address=e.address WHERE c.address IS NULL"))
          print("pko per strong:", q("SELECT json_extract(detail,'$.strong'),COUNT(*),COUNT(DISTINCT chain||address) FROM evidence WHERE type='pays_known_operator' GROUP BY 1"))
          print("pko rows if top50/subject/strong:", q("SELECT SUM(MIN(n,50)) FROM (SELECT COUNT(*) n FROM evidence WHERE type='pays_known_operator' GROUP BY chain,address,json_extract(detail,'$.strong'))"))
          print("all rows if cap50 per subj/type:", q("SELECT SUM(MIN(n,50)) FROM (SELECT COUNT(*) n FROM evidence GROUP BY chain,address,type)"))
          PY
