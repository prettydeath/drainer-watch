name: watch

on:
  schedule:
    # fallback heartbeat only: GitHub throttles schedules on young repos, the cadence comes from the self re-dispatch below
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      max_blocks:
        description: "Blocks per chain for this run (empty = defaults: eth 100, base 450, bsc 2000, tron 300)"
        default: ""
      budget_sec:
        description: "Time budget in seconds"
        default: "420"

permissions:
  contents: write

concurrency:
  group: drainerwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore data from the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data
        continue-on-error: true

      - name: Restore the database from the data-latest release, else the legacy copy on the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p data
          if gh release download data-latest -p drainerwatch.sqlite.gz -D _rel 2>/dev/null; then
            gunzip -c _rel/drainerwatch.sqlite.gz > data/drainerwatch.sqlite && echo "db from release"
          elif [ -f _data/data/drainerwatch.sqlite ]; then
            cp _data/data/drainerwatch.sqlite data/ && echo "db from data branch (migration)"
          else
            echo "no previous db"
          fi
          cp data/drainerwatch.sqlite _db_before.sqlite 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome

      - name: Run
        env:
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          TRONGRID_API_KEYS: ${{ secrets.TRONGRID_API_KEYS }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          MB="${{ github.event.inputs.max_blocks }}"
          BS="${{ github.event.inputs.budget_sec }}"
          python -m drainerwatch run --budget-sec "${BS:-420}" ${MB:+--max-blocks "$MB"}

      - name: Upload the database and large CSVs to the data-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if cmp -s _db_before.sqlite data/drainerwatch.sqlite; then echo "db unchanged"; exit 0; fi
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --prerelease \
            --title "data (rolling)" --notes "Rolling scanner state, overwritten by every watch run. Not a software release."
          mkdir -p _up
          gzip -c data/drainerwatch.sqlite > _up/drainerwatch.sqlite.gz
          for f in contracts.csv drains.csv; do [ -f "data/$f" ] && gzip -c "data/$f" > "_up/$f.gz"; done
          gh release upload data-latest _up/* --clobber
          ls -la _up

      - name: Publish light files to the data branch (single orphan commit)
        id: publish
        run: |
          if [ -d _data ] && [ ! -f _data/data/drainerwatch.sqlite ] && diff -q _data/site/data.json site/data.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no changes"; exit 0
          fi
          rm -rf _pub && mkdir -p _pub/data && cp -r site _pub/
          # light files only: the database and large CSVs live in the data-latest release
          find data -maxdepth 1 -type f ! -name '*.sqlite*' ! -name 'contracts.csv' ! -name 'drains.csv' -size -5M -exec cp {} _pub/data/ \;
          cd _pub
          git init -q -b data
          git config user.name "drainerwatch-bot"
          git config user.email "drainerwatch-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data: update"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          echo "changed=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: run
    if: needs.run.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # Self re-dispatch: keeps a ~10 min cadence without relying on cron. The next run is queued behind this one by the
  # concurrency group; nothing is dispatched when another watch run is already queued (no pile-up, no tight loop).
  next:
    needs: run
    if: ${{ always() && needs.run.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
    steps:
      - name: Wait for the next slot and re-dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          started=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          elapsed=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          wait=$(( 540 - elapsed )); [ $wait -gt 0 ] && sleep $wait
          queued=$(gh api "repos/$GH_REPO/actions/workflows/watch.yml/runs?per_page=20"             --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "$queued" -gt 0 ]; then echo "another watch run is already queued ($queued); not dispatching"; exit 0; fi
          gh workflow run watch.yml --ref "${{ github.ref_name }}"
          echo "dispatched the next run"
