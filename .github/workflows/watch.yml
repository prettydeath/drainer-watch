name: watch

on:
  schedule:
    # fallback heartbeat only: GitHub throttles schedules on young repos, the cadence comes from the self re-dispatch below
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      max_blocks:
        description: "Blocks per chain for this run (empty = per-chain defaults, about 15 min of each chain)"
        default: ""
      budget_sec:
        description: "Scan time budget per chain job in seconds"
        default: "420"

permissions:
  contents: write

concurrency:
  group: drainerwatch
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  # one job per chain, in parallel, each with its own time budget and its own database shard
  # (drainerwatch-<chain>.sqlite.gz in the data-latest release; first run: a copy of the old single database, trimmed)
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        chain: [eth, base, bsc, tron]
    steps:
      - uses: actions/checkout@v4

      - name: Restore the chain shard (else migrate from the single database)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C: ${{ matrix.chain }}
        run: |
          . scripts/release_state.sh
          mkdir -p data _rel
          # a transient API error fails the job (never start from empty state and overwrite the shard)
          rc=0; rel_get "drainerwatch-$C.sqlite.gz" "_rel/drainerwatch-$C.sqlite.gz" || rc=$?
          if [ $rc -eq 0 ]; then
            gunzip -c "_rel/drainerwatch-$C.sqlite.gz" > "data/drainerwatch-$C.sqlite" && echo "shard from release"
          elif [ $rc -eq 2 ]; then
            rc=0; rel_get drainerwatch.sqlite.gz _rel/drainerwatch.sqlite.gz || rc=$?
            if [ $rc -eq 0 ]; then
              gunzip -c _rel/drainerwatch.sqlite.gz > "data/drainerwatch-$C.sqlite" && echo "shard migrated from the single database"
            elif [ $rc -eq 2 ]; then echo "no previous state"
            else echo "::error::release unreachable"; exit 1; fi
          else
            echo "::error::release unreachable"; exit 1
          fi

      - name: Fetch the T1/T2 protect list of the last merge (data branch; missing = lossless retention only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GH_REPO/contents/data/protect.json?ref=data" -H "Accept: application/vnd.github.raw" \
            > data/protect.json 2>/dev/null || rm -f data/protect.json
          ls -la data/protect.json 2>/dev/null || echo "no protect list"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome

      - name: Scan
        env:
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          TRONGRID_API_KEYS: ${{ secrets.TRONGRID_API_KEYS }}
        run: |
          MB="${{ github.event.inputs.max_blocks }}"
          BS="${{ github.event.inputs.budget_sec }}"
          python -m drainerwatch scan --chain "${{ matrix.chain }}" --budget-sec "${BS:-420}" ${MB:+--max-blocks "$MB"}

      - name: Upload the shard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          C: ${{ matrix.chain }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --prerelease \
            --title "data (rolling)" --notes "Rolling scanner state, overwritten by every watch run. Not a software release." || true
          . scripts/release_state.sh
          gzip -c "data/drainerwatch-$C.sqlite" > "drainerwatch-$C.sqlite.gz"
          rel_put "drainerwatch-$C.sqlite.gz"

  # merge the shards into the main database, then roll-up, enrichment, exposure, alerts and render
  merge:
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore data from the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data
        continue-on-error: true

      - name: Restore the main database and the fresh shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . scripts/release_state.sh
          mkdir -p data _rel _shards
          # parallel downloads; a transient API error fails the job: a rebuilt database must never replace the real one
          get() { local rc=0; rel_get "$1" "_rel/$1" || rc=$?; echo "$rc" > "_rel/$1.rc"; }
          for n in drainerwatch.sqlite.gz drainerwatch-eth.sqlite.gz drainerwatch-base.sqlite.gz drainerwatch-bsc.sqlite.gz \
                   drainerwatch-tron.sqlite.gz; do get "$n" & done
          wait
          rc=$(cat _rel/drainerwatch.sqlite.gz.rc)
          pids=""
          if [ "$rc" -eq 0 ]; then
            gunzip -c _rel/drainerwatch.sqlite.gz > data/drainerwatch.sqlite & pids="$pids $!"
            echo "db from release"
          elif [ "$rc" -ne 2 ]; then
            echo "::error::release unreachable"; exit 1
          elif [ -f _data/data/drainerwatch.sqlite ]; then
            cp _data/data/drainerwatch.sqlite data/ && echo "db from data branch (migration)"
          else
            echo "no previous db"
          fi
          for c in eth base bsc tron; do
            rc=$(cat "_rel/drainerwatch-$c.sqlite.gz.rc")
            if [ "$rc" -eq 0 ]; then gunzip -c "_rel/drainerwatch-$c.sqlite.gz" > "_shards/drainerwatch-$c.sqlite" & pids="$pids $!"
            elif [ "$rc" -eq 2 ]; then echo "no shard for $c"
            else echo "::error::release unreachable"; exit 1; fi
          done
          for p in $pids; do wait "$p" || { echo "::error::gunzip failed"; exit 1; }; done
          rm -f _rel/*.gz
          cp data/drainerwatch.sqlite _db_before.sqlite 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome

      - name: Merge and finish
        env:
          ETHERSCAN_API_KEYS: ${{ secrets.ETHERSCAN_API_KEYS }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          TRONGRID_API_KEYS: ${{ secrets.TRONGRID_API_KEYS }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # size diagnostics (rows / bytes per table, evidence by type) of the shards and the main database
          python -m drainerwatch stats _shards/*.sqlite data/drainerwatch.sqlite || true
          if ls _shards/*.sqlite >/dev/null 2>&1; then python -m drainerwatch merge _shards/*.sqlite; fi
          python -m drainerwatch finish --budget-sec 240

      - name: Upload the database and large CSVs to the data-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if cmp -s _db_before.sqlite data/drainerwatch.sqlite; then echo "db unchanged"; exit 0; fi
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --prerelease \
            --title "data (rolling)" --notes "Rolling scanner state, overwritten by every watch run. Not a software release."
          mkdir -p _up
          gzip -c data/drainerwatch.sqlite > _up/drainerwatch.sqlite.gz
          for f in contracts.csv drains.csv; do [ -f "data/$f" ] && gzip -c "data/$f" > "_up/$f.gz"; done
          . scripts/release_state.sh
          for f in _up/*; do rel_put "$f"; done
          ls -la _up

      - name: Publish light files to the data branch (single orphan commit)
        id: publish
        run: |
          if [ -d _data ] && [ ! -f _data/data/drainerwatch.sqlite ] && diff -q _data/site/data.json site/data.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no changes"; exit 0
          fi
          rm -rf _pub && mkdir -p _pub/data && cp -r site _pub/
          # light files only: the database and large CSVs live in the data-latest release
          find data -maxdepth 1 -type f ! -name '*.sqlite*' ! -name 'contracts.csv' ! -name 'drains.csv' -size -5M -exec cp {} _pub/data/ \;
          cd _pub
          git init -q -b data
          git config user.name "drainerwatch-bot"
          git config user.email "drainerwatch-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data: update"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          echo "changed=true" >> "$GITHUB_OUTPUT"

  pages:
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # Self re-dispatch: keeps the cadence without relying on cron. The next run is queued behind this one by the
  # concurrency group; nothing is dispatched when another watch run is already queued (no pile-up, no tight loop).
  next:
    needs: merge
    # !cancelled(): a manual cancel stops the chain, a merge timeout does not
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
    steps:
      - name: Wait for the next slot and re-dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # transient API/network errors must never break the chain: retry, then fall back to safe defaults
          retry() { for i in 1 2 3 4 5; do out=$("$@") && { echo "$out"; return 0; }; sleep $((i * 10)); done; return 1; }
          if started=$(retry gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at); then
            elapsed=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          else
            echo "could not read run start time; assuming 5 min elapsed"; elapsed=300
          fi
          wait=$(( 540 - elapsed )); [ $wait -gt 0 ] && sleep $wait
          queued=$(retry gh api "repos/$GH_REPO/actions/workflows/watch.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length') || queued=0
          if [ "${queued:-0}" -gt 0 ]; then echo "another watch run is already queued ($queued); not dispatching"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            gh workflow run watch.yml --ref "${{ github.ref_name }}" && { echo "dispatched the next run"; exit 0; }
            sleep $((i * 20))
          done
          exit 1
